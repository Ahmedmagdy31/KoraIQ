# Local / single-VM stack.  Usage:
#   cp backend/.env.example backend/.env   (edit secrets)
#   docker compose up --build
#   docker compose run --rm migrate python -m scripts.seed_questions
name: koraiq

x-backend: &backend
  build: ./backend
  env_file: ./backend/.env
  environment:
    DATABASE_URL: postgresql+asyncpg://koraiq:koraiq@db:5432/koraiq
    REDIS_URL: redis://redis:6379/0
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: koraiq, POSTGRES_PASSWORD: koraiq, POSTGRES_DB: koraiq }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U koraiq"], interval: 5s, retries: 10 }

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 10 }

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    <<: *backend
    ports: ["8080:8080"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
  redisdata:
