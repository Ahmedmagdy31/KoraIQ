# Production stack for ONE VPS.  Run from the repo root:
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
# Only Caddy is exposed to the internet (80/443). Postgres and Redis stay on the private Docker network.
name: koraiq

x-backend: &backend
  build: ../backend
  env_file: ./.env
  environment:
    ENV: production
    DATABASE_URL: postgresql+asyncpg://koraiq:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@db:5432/koraiq
    REDIS_URL: redis://redis:6379/0
    FIREBASE_CREDENTIALS: /run/secrets/firebase.json
    GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase.json   # also used for Play Integrity decoding
    TRUSTED_PROXY_HOPS: "1"                                      # Caddy appends the real client IP
  volumes:
    - ./secrets/firebase.json:/run/secrets/firebase.json:ro
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }
  restart: unless-stopped
  logging: &logging
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: koraiq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: koraiq
    volumes: [pgdata:/var/lib/postgresql/data, ./backups:/backups]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U koraiq"], interval: 5s, retries: 20 }
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 20 }
    restart: unless-stopped
    logging: *logging

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    <<: *backend
    environment:
      ENV: production
      DATABASE_URL: postgresql+asyncpg://koraiq:${POSTGRES_PASSWORD}@db:5432/koraiq
      REDIS_URL: redis://redis:6379/0
      FIREBASE_CREDENTIALS: /run/secrets/firebase.json
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase.json
      TRUSTED_PROXY_HOPS: "1"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    expose: ["8080"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
